# ===== Base de données MySQL/MariaDB =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_projets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET:gestionProjetsSecretKeyVeryLongAndSecure2024JWTTokenSignature}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Serveur =====
server.port=${PORT:9090}