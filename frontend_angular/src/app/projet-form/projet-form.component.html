<div class="form-page">
  <nav class="page-breadcrumb" aria-label="Fil d’Ariane">
    <a routerLink="/dashboard">Dashboard</a>
    <span class="separator">/</span>
    <a routerLink="/projets">Projets</a>
    <span class="separator">/</span>
    <span>{{ isEditMode ? 'Modification' : 'Ajout' }}</span>
  </nav>

<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h1>{{ isEditMode ? 'Modifier' : 'Nouveau' }} projet</h1>
      <button class="btn-secondary" (click)="cancel()">Annuler</button>
    </div>

    <div class="alert alert-danger" *ngIf="error">
      {{ error }}
    </div>

    <div class="form-body" *ngIf="!loading">
      <div class="form-group">
        <label>Nom du projet *</label>
        <input type="text" [(ngModel)]="formData.nom" placeholder="Ex: Refonte du site web" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="formData.description" rows="3" placeholder="Description détaillée du projet"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date de début</label>
          <input type="date" [(ngModel)]="formData.dateDebut" />
        </div>
        <div class="form-group">
          <label>Date de fin</label>
          <input type="date" [(ngModel)]="formData.dateFin" />
        </div>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-primary" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : (isEditMode ? 'Modifier' : 'Créer') }}
      </button>
    </div>
  </div>
</div>
</div>
