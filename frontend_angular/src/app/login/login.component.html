<div class="login-page">
  <section class="login-card" aria-label="Connexion">
    <div class="login-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="31" height="31" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="9" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6.9 18.3c1.05-2.75 2.78-4.15 5.1-4.15s4.05 1.4 5.1 4.15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>

    <header class="login-header">
      <h1>Bienvenue</h1>
      <p>Connectez-vous à votre compte</p>
    </header>

    <div class="role-switch" role="tablist" aria-label="Choisir le type de compte">
      <button
        type="button"
        class="role-btn"
        [class.active]="selectedRole === 'ADMIN'"
        [attr.aria-selected]="selectedRole === 'ADMIN'"
        (click)="selectRole('ADMIN')">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3.5 5.5 6.2v5.1c0 4.15 2.7 7.95 6.5 9.2 3.8-1.25 6.5-5.05 6.5-9.2V6.2L12 3.5Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Admin
      </button>

      <button
        type="button"
        class="role-btn"
        [class.active]="selectedRole === 'EMPLOYE'"
        [attr.aria-selected]="selectedRole === 'EMPLOYE'"
        (click)="selectRole('EMPLOYE')">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M6 20c.7-3.4 2.7-5.1 6-5.1s5.3 1.7 6 5.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Employé
      </button>
    </div>

    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form" autocomplete="on">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M6 20c.7-3.4 2.7-5.1 6-5.1s5.3 1.7 6 5.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="votre.email@gmail.com" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
          />
          <button
            class="password-toggle"
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.title]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 12S5.8 5.8 12 5.8 21.5 12 21.5 12 18.2 18.2 12 18.2 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M10.58 10.58A2 2 0 0 0 13.42 13.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9.2 5.95A9.6 9.6 0 0 1 12 5.8C18.2 5.8 21.5 12 21.5 12A16 16 0 0 1 18.75 15.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6.55 7.35C3.9 9.1 2.5 12 2.5 12S5.8 18.2 12 18.2A9.7 9.7 0 0 0 15.45 17.58" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>


      <button type="submit" class="login-btn" [disabled]="loading">
        <svg *ngIf="!loading" viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 7l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M5 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>
  </section>
</div>
