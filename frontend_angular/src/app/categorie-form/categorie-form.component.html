<div class="form-page">
  <nav class="page-breadcrumb" aria-label="Fil d’Ariane">
    <a routerLink="/dashboard">Dashboard</a>
    <span class="separator">/</span>
    <a routerLink="/categories">Catégories</a>
    <span class="separator">/</span>
    <span>{{ isEditMode ? 'Modification' : 'Ajout' }}</span>
  </nav>

<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <div>
        <h1>{{ isEditMode ? 'Modifier' : 'Nouvelle' }} catégorie</h1>
        <p>{{ isEditMode ? 'Mettez à jour les informations de la spécialité' : 'Ajoutez une nouvelle spécialité au système' }}</p>
      </div>
      <button class="btn-secondary" type="button" (click)="cancel()">Annuler</button>
    </div>

    <div class="alert alert-danger" *ngIf="error">
      {{ error }}
    </div>

    <div class="form-body" *ngIf="!loading">
      <div class="form-group">
        <label>Nom de la catégorie *</label>
        <input type="text" [(ngModel)]="formData.nom" placeholder="Ex: Développeur" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          rows="5"
          [(ngModel)]="formData.description"
          placeholder="Ex: Développement logiciel et applications"
        ></textarea>
      </div>
    </div>

    <div class="loading-block" *ngIf="loading">
      Chargement de la catégorie...
    </div>

    <div class="form-footer">
      <button class="btn-primary" type="button" (click)="onSubmit()" [disabled]="loading || saving">
        {{ saving ? 'Enregistrement...' : (isEditMode ? 'Modifier' : 'Créer') }}
      </button>
    </div>
  </div>
</div>

</div>
