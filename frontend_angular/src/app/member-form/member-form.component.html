<div class="form-page">
  <nav class="page-breadcrumb" aria-label="Fil d’Ariane">
    <a routerLink="/dashboard">Dashboard</a>
    <span class="separator">/</span>
    <a routerLink="/members">Employés</a>
    <span class="separator">/</span>
    <span>{{ isEditMode ? 'Modification' : 'Ajout' }}</span>
  </nav>

<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h1>{{ isEditMode ? 'Modifier' : 'Nouvel' }} employé</h1>
      <button class="btn-secondary" (click)="cancel()">Annuler</button>
    </div>

    <div class="alert alert-danger" *ngIf="error">
      {{ error }}
    </div>

    <div class="form-body" *ngIf="!loading">
      <div class="form-row">
        <div class="form-group">
          <label>Nom *</label>
          <input type="text" [(ngModel)]="formData.nom" placeholder="Nom" />
        </div>
        <div class="form-group">
          <label>Prénom *</label>
          <input type="text" [(ngModel)]="formData.prenom" placeholder="Prénom" />
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="formData.email" placeholder="email@exemple.com" />
      </div>

      <div class="form-group">
        <label>Mot de passe {{ isEditMode ? '(vide = inchangé)' : '*' }}</label>
        <input type="password" [(ngModel)]="formData.password" placeholder="••••••••" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Matricule</label>
          <input type="text" [(ngModel)]="formData.matricule" placeholder="EMP-001" />
        </div>
        <div class="form-group">
          <label>Catégorie</label>
          <select [(ngModel)]="formData.categorieId">
            <option [value]="null">-- Choisir --</option>
            <option *ngFor="let c of categories" [value]="c.id">{{ c.nom }}</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-primary" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : (isEditMode ? 'Modifier' : 'Créer') }}
      </button>
    </div>
  </div>
</div>
</div>
